# Build the site and publish it to GitHub Pages.
#
# The pages load data/*.js, which build.sh writes from data/*.json. Those .js files are
# gitignored on purpose — committing both copies makes every data change show up as two
# diffs, one of them unreadable minified JSON. So the runner builds them here instead.
# The consequence is that the live site can never disagree with data/items.json.

name: Deploy to GitHub Pages

# Every branch is built and validated. Only master is published — see the `if` on the
# deploy job. A branch can therefore be used to watch a bad commit fail without that
# commit reaching the live site.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Do not cancel a running one — a half-finished deploy is worse
# than a slightly stale one.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Before anything is built from it. build.sh rewrites ids, paths and the search
      # index off items.json, so a fault checked afterwards would already have been
      # copied into three more files. Checked here, a bad commit stops the build.
      #
      # Not scripts/validate-report.py — that one checks incoming research reports and
      # rejects items.json by design. This is the catalogue's own validator.
      - name: Validate the catalogue
        run: python3 scripts/validate-catalogue.py

      # And prove the validator still bites. A check that has quietly stopped catching
      # anything is worse than no check, because the green tick says otherwise.
      - name: Check the validator still catches its faults
        run: python3 scripts/test-validate-catalogue.py

      # measure.py is the file every document quotes, so a wrong number there becomes a
      # wrong number everywhere at once. This checks its own output: types, and that
      # every partition sums to the population it partitions.
      - name: Check the measurements describe the catalogue
        run: python3 scripts/test-measure.py

      # The picks are a committed model judgment, so they rot two ways: a stale pool
      # (warned, dated, ships) and a dead or ineligible pick (fails - "open this one
      # first" about a page nobody can open is the site lying in its own voice).
      - name: Validate the picks
        run: python3 scripts/validate-picks.py

      - name: Check the picks validator still catches its faults
        run: python3 scripts/test-validate-picks.py

      # Every build script uses the standard library only, and --keywords keeps
      # build-search-index.py off the network. There is nothing to install.
      - name: Build ids, sources, paths, search index and the js mirrors
        run: ./build.sh

      - name: Stop if a data file did not get written
        run: |
          for f in data/items.js data/paths.js data/search-keywords.js; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done

      # A visitor arriving from the home page with ?q=<a sentence> must get an answer.
      # Runs after build.sh because it loads the generated data/*.js the browser loads -
      # those are gitignored, so before the build they do not exist. It runs the real
      # browse.js against a DOM stub, because the fault it guards was never in the
      # ranking function scripts/test-search.py covers; it was in the trigger, and the
      # ranking test passed happily throughout.
      - name: Check a question asked on the home page is answered on Browse
        run: node scripts/test-browse-query.js

      - name: Check search still answers the sentences visitors typed
        run: python3 scripts/test-search.py

      # Copy only what the browser asks for. scripts/, docs/, research/ and prompts/
      # stay in the repo but do not need to be served.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html browse.html paths.html resource.html how-we-check.html _site/
          cp favicon.svg robots.txt sitemap.xml _site/
          cp -r assets data _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    # Only master is published. Other branches stop after the build, so a deliberate
    # break can be watched going red without shipping anything.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
