# Source registry — where the pipeline looks for content.
# The scheduler works through this file in priority order, one source per run.
# Nothing is harvested that is not listed here.
#
# priority: 1 = harvest first and re-check most often, 3 = v2 / opportunistic
# method:   how we get the data
#             api      - official API or feed, clean and reliable
#             fetch    - plain page fetch, parse HTML
#             search   - web search results only (site blocks direct fetch)
#             browser  - needs a real browser (JS-rendered or soft login wall)
#             manual   - human has to do it
# tier_cap: best review tier this source can reach
#             reviewed  - we can consume the actual content
#             previewed - we can read syllabus/outline/free sample only
#             listed    - metadata only
# cadence:  how often to re-check
#
# Created 2026-08-16. Every entry needs a checked date once harvested.

groups:

  # ---------------------------------------------------------------
  # A. Official Anthropic — the backbone. Free, authoritative, clean.
  # ---------------------------------------------------------------
  - id: official
    label: Official Anthropic
    priority: 1
    sources:
      - name: Anthropic Academy course browser
        url: https://claude.com/resources/courses
        method: fetch
        tier_cap: reviewed
        cadence: weekly
        notes: Exposes lecture count and video length per course. Best machine-readable seed we have.
      - name: Anthropic Academy (Skilljar)
        url: https://anthropic.skilljar.com/
        method: fetch
        tier_cap: reviewed
        cadence: weekly
        notes: 20 courses + 1 path, all free. Needs a Skilljar account to enrol, catalog is public.
      - name: Official tutorials
        url: https://claude.com/resources/tutorials
        method: fetch
        tier_cap: reviewed
        cadence: weekly
      - name: Claude Platform docs
        url: https://platform.claude.com/docs/en/home
        method: fetch
        tier_cap: reviewed
        cadence: monthly
        notes: API and SDK. Do not conflate with the Claude Code docs.
      - name: Claude Code docs
        url: https://code.claude.com/docs/en/overview
        method: fetch
        tier_cap: reviewed
        cadence: monthly
      - name: Help Center
        url: https://support.claude.com/en/
        method: fetch
        tier_cap: reviewed
        cadence: monthly
        notes: End-user, non-developer. Underrated for the non-technical audience.
      - name: Anthropic engineering blog
        url: https://www.anthropic.com/engineering
        method: fetch
        tier_cap: reviewed
        cadence: weekly
      - name: Claude blog
        url: https://claude.com/blog
        method: fetch
        tier_cap: reviewed
        cadence: weekly
      - name: Anthropic newsroom
        url: https://www.anthropic.com/news
        method: fetch
        tier_cap: reviewed
        cadence: weekly
      - name: YouTube @claude
        url: https://www.youtube.com/@claude
        feed: https://www.youtube.com/feeds/videos.xml?channel_id=UCV03SRZXJEz-hchIAogeJOg
        method: api
        tier_cap: reviewed
        cadence: weekly
        notes: The official teaching channel. Several uploads a week.
      - name: YouTube @anthropic-ai
        url: https://www.youtube.com/@anthropic-ai
        feed: https://www.youtube.com/feeds/videos.xml?channel_id=UCrDwWp7EBBv4NwvScIpBDOA
        method: api
        tier_cap: reviewed
        cadence: monthly
        notes: Research and launches, not tutorials. Lower teaching value.
      - name: Anthropic GitHub org
        url: https://github.com/anthropics
        method: api
        tier_cap: reviewed
        cadence: weekly
        notes: >
          Watch skills, claude-code, claude-cookbooks, claude-quickstarts,
          prompt-eng-interactive-tutorial, claude-agent-sdk-python.
          anthropics/courses is stale since 2025-11-13 - flag as superseded, do not recommend.
      - name: Model Context Protocol org
        url: https://github.com/modelcontextprotocol
        method: api
        tier_cap: reviewed
        cadence: weekly
      - name: Certification (Pearson VUE)
        url: https://www.pearsonvue.com/us/en/anthropic.html
        method: fetch
        tier_cap: previewed
        cadence: monthly
        notes: >
          Partner-Network gated. A whole SEO industry sells prep for exams most
          readers cannot sit. Worth an explicit warning page on our site.

