# ---------------------------------------------------------------
# Global rules
# ---------------------------------------------------------------
rules:
  - No public submissions in v1. Submission flood is what killed curation on
    every large list we studied (one competitor has 1,122 unprocessed PRs).
  - Aggregators (Class Central, awesomeclaude.ai, awesome-lists) are DISCOVERY
    SEEDS only. Always verify an item at its original source before listing it.
  - Never copy another site's description or review. Write our own or say nothing.
  - Every harvested item records the source id and the date checked.
  - If a source blocks us, record that as a fact on the source, do not silently skip it.
